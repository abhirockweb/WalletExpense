name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download source
        run: |
          mkdir -p /tmp/src
          curl -fL -o /tmp/wallet.zip "https://muse.ai/files/1237082279498569/1826437808351617/6kzsofqyvoxeydn56g0mprd3/WalletExpense.zip"
          unzip -q /tmp/wallet.zip -d /tmp/src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: /tmp/src/WalletExpense
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test-run app on Android 10 emulator
        id: emulator_test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r /tmp/src/WalletExpense/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.walletexpense.app/.MainActivity
            sleep 15
            adb logcat -d -v brief > /tmp/logcat-full.txt
            grep -i -E "walletexpense|FATAL EXCEPTION|AndroidRuntime|Process.*com.walletexpense" /tmp/logcat-full.txt | tail -n 300 > /tmp/logcat.txt || true
            
            # Verify app process is still alive; fail step if dead
            adb shell pidof com.walletexpense.app

      - name: Report crash log on failure
        if: failure() && steps.emulator_test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/logcat.txt ]; then
            head -c 10000 /tmp/logcat.txt > /tmp/log-tail.txt
          else
            echo "No logcat output found." > /tmp/log-tail.txt
          fi
          gh issue create --title "Emulator crash log for run #${{ github.run_number }}" --body-file /tmp/log-tail.txt

      - name: Publish APK to Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp /tmp/src/WalletExpense/app/build/outputs/apk/debug/app-debug.apk ./WalletExpense.apk
          gh release create "v1.0.${{ github.run_number }}" ./WalletExpense.apk \
            --title "WalletExpense APK (Build #${{ github.run_number }})" \
            --notes "Debug build automatically verified on Android 10."

      - name: Upload APK artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WalletExpense-APK
          path: /tmp/src/WalletExpense/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
