name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download source
        run: |
          curl -L -o /tmp/wallet.zip "https://muse.ai/files/1237082279498569/1826437808351617/6kzsofqyvoxeydn56g0mprd3/WalletExpense.zip"
          unzip -q /tmp/wallet.zip -d /tmp/src
          ls /tmp/src/WalletExpense

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: /tmp/src/WalletExpense
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Report build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 10000 /tmp/build.log > /tmp/build-tail.txt || true
          gh issue create --title "Build log for run ${{ github.run_number }}" --body-file /tmp/build-tail.txt || true

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp /tmp/src/WalletExpense/app/build/outputs/apk/debug/app-debug.apk ./WalletExpense.apk
          gh release create "apk-${{ github.run_number }}" ./WalletExpense.apk --title "WalletExpense APK" --notes "Ready-to-install debug APK. Download WalletExpense.apk below and tap it to install."

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: WalletExpense-APK
          path: /tmp/src/WalletExpense/app/build/outputs/apk/debug/app-debug.apk
