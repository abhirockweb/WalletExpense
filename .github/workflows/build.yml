name: Android CI / CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*' # Trigger release builds on version tags like v1.0.0
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build Debug APK & Run Unit Tests
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Emulator Smoke Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          profile: pixel_2
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.walletexpense.app/.MainActivity

            # Poll for process existence (up to 30 seconds) instead of a blind sleep
            TIMEOUT=30
            while [ $TIMEOUT -gt 0 ]; do
              if adb shell pidof com.walletexpense.app > /dev/null; then
                echo "App process detected."
                break
              fi
              sleep 2
              TIMEOUT=$((TIMEOUT-2))
            done

            if [ $TIMEOUT -le 0 ]; then
              echo "Error: App failed to launch within timeout."
              adb logcat -d -v brief > /tmp/logcat-crash.txt
              exit 1
            fi

            # Collect logcat output for artifact collection
            adb logcat -d -v brief > /tmp/logcat-full.txt
            grep -i -E "walletexpense|FATAL EXCEPTION|AndroidRuntime" /tmp/logcat-full.txt | tail -n 300 > /tmp/logcat.txt || true

      - name: Upload Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-crash-log
          path: |
            /tmp/logcat-full.txt
            /tmp/logcat.txt
            /tmp/logcat-crash.txt
          retention-days: 7

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    name: Publish Release APK
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create GitHub Releases
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "${{ steps.sign_app.outputs.signedReleaseFile }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
